<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    /* Flutter アプリ領域の下に広告分の余白を確保 */
    body {
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 100px);
      box-sizing: border-box;
    }

    /* ⭐ 最下部固定・中央寄せ広告 */
    #adstir_banner {
      position: fixed;
      bottom: env(safe-area-inset-bottom, 0px);
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 100px;
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
    }

    #adstir_slot {
      width: 320px;
      height: 100px;
    }
  </style>
</head>

<body>
  <!-- Flutter 起動 -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- ⭐ 最下部固定広告 -->
  <div id="adstir_banner">
    <div id="adstir_slot"></div>

    <script type="text/javascript">
      window.adstir_vars = {
        ver: "4.0",
        app_id: "MEDIA-d51fb80d",
        ad_spot: 1,
        center: true        // ← 中央揃えを強制
      };
    </script>

    <!-- ⭐ HTTPS 強制で読み込み（GitHub Pagesでも確実に動く） -->
    <script src="https://js.ad-stir.com/js/adstir.js"></script>
  </div>
</body>
</html>
