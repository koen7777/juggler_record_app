<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juggler Record App</title>

  <!-- GitHub Pages 配置用 base href -->
  <base href="/juggler_record_app/">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      box-sizing: border-box;
    }

    /* Flutter Web 画面下に広告スペース確保 */
    body {
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 100px);
    }

    /* 最下部固定広告 */
    #adstir_banner {
      position: fixed;
      bottom: env(safe-area-inset-bottom, 0px);
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      max-width: 100%;
      height: 100px;
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff; /* 広告枠確認用 */
      pointer-events: auto;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
    }

    #adstir_slot {
      width: 320px;
      height: 100px;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Flutter Web 起動 -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- 最下部固定広告 -->
  <div id="adstir_banner">
    <div id="adstir_slot"></div>
  </div>

  <!-- AdStir 初期化 -->
  <script type="text/javascript">
    function initAdStir() {
      if (!window.adstir_initialized) {
        window.adstir_initialized = true;

        window.adstir_vars = {
          ver: "4.0",
          app_id: "MEDIA-d51fb80d",
          ad_spot: 1,
          center: true
        };

        const s = document.createElement("script");
        s.src = "https://js.ad-stir.com/js/adstir.js";
        s.async = true;
        document.body.appendChild(s);
      }
    }

    // ページロード後に初期化
    window.addEventListener("load", () => {
      initAdStir();
      setTimeout(initAdStir, 500); // Flutter描画後に再初期化
    });

    // Flutter 画面切り替えで広告が消えた場合に復活
    const observer = new MutationObserver(() => {
      const banner = document.getElementById("adstir_banner");
      if (!banner) {
        const newBanner = document.createElement("div");
        newBanner.id = "adstir_banner";
        newBanner.innerHTML = '<div id="adstir_slot"></div>';
        Object.assign(newBanner.style, {
          position: 'fixed',
          bottom: 'env(safe-area-inset-bottom, 0px)',
          left: '50%',
          transform: 'translateX(-50%)',
          width: '320px',
          maxWidth: '100%',
          height: '100px',
          zIndex: 99999,
          display: 'flex',
          justifyContent: 'center',
          alignItems: 'center',
          background: '#ffffff',
          pointerEvents: 'auto',
          boxShadow: '0 0 5px rgba(0,0,0,0.2)'
        });
        document.body.appendChild(newBanner);
        initAdStir();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>

  <!-- Service Worker キャッシュ問題対策 -->
  <!-- DevTools → Application → Service Workers → Unregister を推奨 -->

</body>
</html>
