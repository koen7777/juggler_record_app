<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 100px);
      box-sizing: border-box;
    }

    #adstir_banner {
      position: fixed;
      bottom: env(safe-area-inset-bottom, 0px);
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 100px;
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
    }

    #adstir_slot {
      width: 320px;
      height: 100px;
    }
  </style>
</head>

<body>
  <script src="flutter_bootstrap.js" async></script>

  <div id="adstir_banner">
    <div id="adstir_slot"></div>

    <script type="text/javascript">
      window.adstir_vars = {
        ver: "4.0",
        app_id: "MEDIA-d51fb80d",
        ad_spot: 1,
        center: false
      };
    </script>
    <script src="https://js.ad-stir.com/js/adstir.js"></script>
  </div>

  <!-- 🔄 タブ復帰時に広告を再読み込み -->
  <script>
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) {
        try {
          const slot = document.getElementById('adstir_slot');
          slot.innerHTML = "";
          if (window.adstir && window.adstir.reload) {
            window.adstir.reload(1);
          }
        } catch (e) {}
      }
    });
  </script>
</body>
</html>
