<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flutter App</title>

  <link rel="manifest" href="manifest.json">

  <!-- Flutter -->
  <script src="flutter.js" defer></script>

  <!-- ------------------------------- -->
  <!-- ★ AdStir 広告（グローバル設定） -->
  <!-- ------------------------------- -->
  <script type="text/javascript">
    window.adstir_vars = {
      ver: "4.0",
      app_id: "MEDIA-d51fb80d",   // ★あなたの AdStir App ID
      ad_spot: 1,
      center: true
    };
  </script>
  <script type="text/javascript" src="https://js.ad-stir.com/js/adstir.js"></script>

  <style>
    /* ページ下部の固定広告 */
    #adstir-banner-fixed {
      width: 100%;
      max-width: 320px;
      height: 100px;
      margin: 0 auto;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      background: #fff;
      text-align: center;
    }

    /* Flutter canvas が広告に被らないよう余白を追加 */
    body {
      padding-bottom: 110px;
    }
  </style>
</head>

<body>

  <!-- Flutter Canvas -->
  <div id="flutter_target"></div>

  <!-- ------------------------------- -->
  <!-- ★ ページ最下部に固定表示する AdStir -->
  <!-- ------------------------------- -->
  <div id="adstir-banner-fixed">
    <div id="adstir-spot-1" style="width:320px; height:100px; margin:0 auto;"></div>
  </div>

  <script>
    window.addEventListener('load', function () {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        }
      }).then(function(engineInitializer) {
        return engineInitializer.initializeEngine();
      }).then(function(appRunner) {
        return appRunner.runApp();
      });
    });
  </script>

</body>
</html>
