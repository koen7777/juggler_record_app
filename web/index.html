<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juggler Record App</title>

  <!-- IMPORTANT: Flutter build --base-href requires this placeholder -->
  <base href="$FLUTTER_BASE_HREF">

  <style>
    html, body { margin:0; padding:0; height:100%; box-sizing:border-box; }
    body { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 100px); }

    #adstir_banner {
      position: fixed;
      bottom: env(safe-area-inset-bottom, 0px);
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      max-width: 100%;
      height: 100px;
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      pointer-events: auto;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
    }

    #adstir_slot {
      width: 320px;
      height: 100px;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Flutter Web bootstrap (do not change) -->
  <script src="flutter_bootstrap.js"></script>

  <!-- Fixed bottom ad slot -->
  <div id="adstir_banner">
    <div id="adstir_slot"></div>
  </div>

  <script>
    /* Load AdStir with cache-buster and safe re-initialization */
    function loadAdStir() {
      window.adstir_vars = {
        ver: "4.0",
        app_id: "MEDIA-d51fb80d",
        ad_spot: 1,
        center: true
      };
      const s = document.createElement("script");
      s.src = "https://js.ad-stir.com/js/adstir.js?t=" + Date.now();
      s.async = true;
      document.body.appendChild(s);
    }

    window.addEventListener("load", () => {
      loadAdStir();
      setTimeout(loadAdStir, 600); // re-run after Flutter initial rendering
    });

    // If Flutter removes the banner element, recreate it and reload ad
    const observer = new MutationObserver(() => {
      if (!document.getElementById("adstir_banner")) {
        const b = document.createElement("div");
        b.id = "adstir_banner";
        b.innerHTML = '<div id="adstir_slot"></div>';
        document.body.appendChild(b);
        loadAdStir();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Unregister service workers to avoid stale cached files
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(reg => reg.unregister());
      }).catch(()=>{/* ignore */});
    }
  </script>

</body>
</html>
