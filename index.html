<!DOCTYPE html>
<html>
<head>
  <base href="/juggler_record_app/">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    /* ▼ Flutter アプリ領域に広告分 + iOSホームバー分の余白を確保 */
    body {
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 100px);
      box-sizing: border-box;
    }

    /* ▼ 最下部固定 320×100 広告コンテナ */
    #adstir_banner {
      position: fixed;
      bottom: env(safe-area-inset-bottom, 0px);
      left: 0;
      right: 0;
      height: 100px;

      display: flex;
      justify-content: center;
      align-items: center;

      z-index: 99999;
      background: transparent;

      pointer-events: none; /* ← Flutter側を触れるように */
    }

    /* ▼ 広告本体だけ pointer 有効にする */
    #adstir_slot {
      width: 320px;
      height: 100px;
      pointer-events: auto; /* ← 広告クリックだけ有効 */
    }
  </style>
</head>

<body>
  <!-- Flutter Web 本体 -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- ▼▼ AdStir 固定広告 ▼▼ -->
  <div id="adstir_banner">
    <div id="adstir_slot"></div>

    <script type="text/javascript">
      var adstir_vars = {
        ver: "4.0",
        app_id: "MEDIA-d51fb80d",
        ad_spot: 1,
        center: true /* ← 完全中央表示 */
      };
    </script>
    <script type="text/javascript" src="https://js.ad-stir.com/js/adstir.js"></script>
  </div>
  <!-- ▲▲ AdStir 固定広告 ▲▲ -->

</body>
</html>
