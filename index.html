<!DOCTYPE html>
<html>
<head>
  <base href="/juggler_record_app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="自分がプレイしたパチスロのデータを記録・管理できるWebアプリです。統計やグラフでプレイ内容を分析できます。">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="juggler_record_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>juggler_record_app</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding-top: 100px; /* 広告ぶん押し下げる */
    }

    /* Flutter が広告より後ろだがタップ可能に */
    flutter-view, canvas, #flt-glass-pane {
      z-index: 1 !important;
      position: relative !important;
    }

    /* 広告：見えるけどタップは下へ通す */
    #ad-banner-fixed {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100px;
      background: #f5f5f5;
      text-align: center;
      z-index: 99999;
      pointer-events: none; /* ←ここが重要！ */
    }
  </style>
</head>

<body>

  <!-- 固定広告 -->
  <div id="ad-banner-fixed">
    <script type="text/javascript">
      var adstir_vars = {
        ver: "4.0",
        app_id: "MEDIA-d51fb80d",
        ad_spot: 1,
        center: true
      };
    </script>
    <script type="text/javascript" src="https://js.ad-stir.com/js/adstir.js"></script>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
