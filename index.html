<!DOCTYPE html>
<html>
<head>
  <base href="/juggler_record_app/">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: auto; /* ←スクロール有効 */
    }

    /* ★ Flutter全体を普通に表示（100vhのまま） */
    #flutter_container {
      width: 100%;
      height: 100%; /* ←ここを縮めないのが重要 */
    }

    /* ★ アプリ最下部の余白（広告避け） */
    body {
      padding-bottom: 100px; /* ←広告分のスペース */
      box-sizing: border-box;
    }

    /* ★ 固定広告 */
    #adstir_banner {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100px;
      background: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
  </style>

  <script>
    const serviceWorkerVersion = "1081132625";
  </script>
  <script defer src="flutter.js"></script>
</head>

<body>

  <div id="flutter_container">
    <script>
      window.addEventListener('load', function () {
        _flutter.loader.loadEntrypoint({
          onEntrypointLoaded: function (engineInitializer) {
            engineInitializer.initializeEngine().then(function (appRunner) {
              appRunner.runApp();
            });
          },
        });
      });
    </script>
  </div>

  <!-- 固定広告 -->
  <div id="adstir_banner">
    <script type="text/javascript">
      var adstir_vars = {
        ver: "4.0",
        app_id: "MEDIA-d51fb80d",
        ad_spot: 1,
        center: false
      };
    </script>
    <script type="text/javascript" src="https://js.ad-stir.com/js/adstir.js"></script>
  </div>

</body>
</html>
